spring.application.name=prodavnica-igara

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prodavnica_igara?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=${HIBERNATE_HBM2DDL:update}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false

spring.mvc.servlet.path=/api

server.servlet.register-default-servlet=true

server.servlet.context-path=/prodavnica-igara
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
